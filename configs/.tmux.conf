# change the prefix from 'C-b' to 'C-a'
# (remap capslock to CTRL for easy access)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# start with window 1 (instead of 0)
set -g base-index 1

# start with pane 1
set -g pane-base-index 1

# split panes using | and -, make sure they open in the same path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# create a floating pane on top of the current panes
bind h display-popup -E "$SHELL"

unbind '"'
unbind %

# open new windows in the current path
bind c new-window -c "#{pane_current_path}"

# reload config file
bind r source-file ~/.tmux.conf

unbind p
bind p previous-window

# shorten command delay
set -sg escape-time 1

# don't rename windows automatically
set -g allow-rename off

# mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# enable vi mode keys
set-window-option -g mode-keys vi

# enable extended key sequences for terminals that support it (e.g. ghostty)
set -g extended-keys on

# set default terminal mode to 256 colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# allow focus events to get through to applications running in tmux
set -g focus-events on


# Design Tweaks
# -------------

# loud or quiet?
set -g visual-activity on
set -g visual-bell on
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

#  modes
setw -g clock-mode-colour yellow
setw -g mode-style 'fg=black bg=red bold'

# panes
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=red'

set -g status-left '#{?client_prefix,#[fg=green],#[fg=red]} '
set -g status-left-length 10


set -g status-right-style 'fg=black bg=yellow'
set -g status-right '#[bg=terminal fg=yellow]#[bg=yellow fg=black]%Y-%m-%d %H:%M#[bg=terminal fg=yellow]#[bg=yellow fg=black]'

setw -g window-status-current-style 'fg=black bg=red bold'
setw -g window-status-current-format '#[bg=terminal fg=red]#[bg=red fg=black]#I #W #F#[bg=terminal fg=red]#[bg=red fg=black]'

setw -g window-status-style 'fg=red'
setw -g window-status-separator ''
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
set -g message-style 'fg=yellow bg=terminal bold'

# -- clipboard -----------------------------------------------------------------

# let tmux write to the system clipboard via OSC 52 (works in Ghostty, also over SSH)
set -s set-clipboard on
set -as terminal-features ',xterm-ghostty:clipboard:RGB,xterm-256color:clipboard'

# pick the right clipboard tool for this OS (tmux 3.2+)
if -b 'command -v pbcopy  >/dev/null 2>&1' 'set -s copy-command "pbcopy"'
if -b '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1' 'set -s copy-command "wl-copy"'
if -b '[ -z "$WAYLAND_DISPLAY" ] && command -v xclip >/dev/null 2>&1' 'set -s copy-command "xclip -selection clipboard -i"'
if -b 'command -v clip.exe >/dev/null 2>&1' 'set -s copy-command "clip.exe"'

# vi-style selection: prefix [ (or Enter), v to select, y to copy
bind Enter copy-mode
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi C-v    send -X rectangle-toggle
bind -T copy-mode-vi y      send -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send -X cancel
# mouse drag copies too
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# -- autosave / restore sessions -----------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-save-interval '15'      # minutes
set -g @continuum-restore 'on'            # restore last session when tmux starts
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session' # restore nvim sessions (needs vim-obsession)

# must stay the very last line
run '~/.tmux/plugins/tpm/tpm'